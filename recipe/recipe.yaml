schema_version: 1

context:
  version: "0.4.9"

package:
  name: fetch
  version: ${{ version }}

source:
  url: https://github.com/gruntwork-io/fetch/archive/v${{ version }}.tar.gz
  sha256: 4d0a62de2afe4519324815570fbf0eea75edb7b29734844f403d91f13b32e034

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - fetch --help

about:
  license: MIT
  license_file:
    - LICENSE.txt
    - license-files/
  summary: Download assets from a commit, branch, or tag of GitHub repositories
  homepage: https://github.com/gruntwork-io/fetch
  repository: https://github.com/gruntwork-io/fetch

extra:
  recipe-maintainers:
    - danielnachun
